upstream app {
	# Keeps the upstream valid before the first release, when upstream.conf does not exist yet.
	server 127.0.0.1:9 down;
	# release.py points this at the live slot's port, then reloads nginx. A glob, so a missing file is no error.
	include /var/lib/deploy-agent/upstream*.conf;
}

server {
	# The only public port on the VM. Central's proxy serves the app's domain and TLS in front of it.
	listen 80 default_server;
	listen [::]:80 default_server;

	client_max_body_size 100m;

	location / {
		proxy_pass http://app;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# TLS ends at Central's proxy, so keep the scheme it saw.
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
	}
}

map $http_upgrade $connection_upgrade {
	default upgrade;
	"" close;
}
