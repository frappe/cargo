# Rendered with Python's string.Template: $${NAME} is Cargo's, $$name is nginx's own variable.
# A pilot ships whatever it has buffered, so a batch is as big as its outage was long: nginx
# sets no body limit and streams it through.

server {
	listen 80;
	listen [::]:80;
	server_name telemetry-svc.${WILDCARD_DOMAIN} telemetry-read-svc.${WILDCARD_DOMAIN};

	return 301 https://$$host$$request_uri;
}

# Pilots write over the WireGuard mesh, which Atlas routes for internal- names. Plain HTTP with
# no redirect, which would send the write over the internet.
server {
	listen 80;
	listen [::]:80;
	server_name internal-telemetry-svc.${WILDCARD_DOMAIN};

	client_max_body_size 0;
	proxy_request_buffering off;

	location / {
		proxy_pass http://${DATUM_UPSTREAM};
		proxy_set_header Host $$http_host;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name telemetry-svc.${WILDCARD_DOMAIN};

	ssl_certificate ${CERTIFICATE};
	ssl_certificate_key ${CERTIFICATE_KEY};

	client_max_body_size 0;
	proxy_request_buffering off;

	location / {
		proxy_pass http://${DATUM_UPSTREAM};
		proxy_set_header Host $$http_host;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name telemetry-read-svc.${WILDCARD_DOMAIN};

	ssl_certificate ${CERTIFICATE};
	ssl_certificate_key ${CERTIFICATE_KEY};

	client_max_body_size 0;
	proxy_buffering off;

	location = /ping {
		proxy_pass http://${CLICKHOUSE_UPSTREAM};
	}

	# A query always carries SQL, in ?query= or a POST body, so a bare GET or HEAD of / is
	# ClickHouse's landing page.
	location = / {
		set $$landing "";
		if ($$request_method ~ ^(GET|HEAD)$$) {
			set $$landing "yes";
		}
		if ($$arg_query) {
			set $$landing "";
		}
		if ($$landing) {
			return 404;
		}

		proxy_pass http://${CLICKHOUSE_UPSTREAM};
	}

	# Only queries and the health check. ClickHouse's own UIs (/play, /dashboard, /binary,
	# /merges) stay internal.
	location / {
		return 404;
	}
}
