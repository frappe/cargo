# A pilot ships whatever it buffered during an outage, so bodies stream with no size cap.

server {
	listen 80;
	listen [::]:80;
	server_name telemetry-svc.{{ domain }} telemetry-read-svc.{{ domain }};

	return 301 https://$host$request_uri;
}

# Pilots write over the WireGuard mesh. Plain HTTP with no redirect, which would send the write
# over the internet.
server {
	listen 80;
	listen [::]:80;
	server_name internal-telemetry-svc.{{ domain }};

	client_max_body_size 0;
	proxy_request_buffering off;

	location / {
		proxy_pass http://{{ datum_upstream }};
		proxy_set_header Host $http_host;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name telemetry-svc.{{ domain }};

	ssl_certificate {{ certificate }};
	ssl_certificate_key {{ certificate_key }};

	client_max_body_size 0;
	proxy_request_buffering off;

	location / {
		proxy_pass http://{{ datum_upstream }};
		proxy_set_header Host $http_host;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name telemetry-read-svc.{{ domain }};

	ssl_certificate {{ certificate }};
	ssl_certificate_key {{ certificate_key }};

	client_max_body_size 0;
	proxy_buffering off;

	location = /ping {
		proxy_pass http://{{ clickhouse_upstream }};
	}

	# A query carries SQL in ?query= or a POST body, so a bare GET or HEAD of / is ClickHouse's
	# landing page.
	location = / {
		set $landing "";
		if ($request_method ~ ^(GET|HEAD)$) {
			set $landing "yes";
		}
		if ($arg_query) {
			set $landing "";
		}
		if ($landing) {
			return 404;
		}

		proxy_pass http://{{ clickhouse_upstream }};
	}

	# ClickHouse's own UIs (/play, /dashboard, /binary, /merges) stay internal.
	location / {
		return 404;
	}
}
