# S3 signs the Host header into every request, so it passes through unchanged. Bodies stream
# both ways with no size cap. CORS is Garage's, per bucket; nginx only adds what Garage leaves out.

map $request_method $preflight_max_age {
	OPTIONS 3600;
	default "";
}

server {
	listen 80;
	listen [::]:80;
	server_name s3-svc.{{ domain }} s3-admin-svc.{{ domain }};

	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name s3-svc.{{ domain }};

	ssl_certificate {{ certificate }};
	ssl_certificate_key {{ certificate_key }};

	client_max_body_size 0;
	proxy_request_buffering off;
	proxy_buffering off;

	add_header Access-Control-Max-Age $preflight_max_age always;
	add_header Vary Origin always;

	location / {
		proxy_pass http://{{ s3_upstream }};
		proxy_set_header Host $http_host;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name s3-admin-svc.{{ domain }};

	ssl_certificate {{ certificate }};
	ssl_certificate_key {{ certificate_key }};

	location / {
		proxy_pass http://{{ admin_upstream }};
		proxy_set_header Host $http_host;
	}
}
