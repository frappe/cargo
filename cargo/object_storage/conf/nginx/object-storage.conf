# Rendered with Python's string.Template: $${NAME} is Cargo's, $$name is nginx's own variable.
# nginx passes Host through unchanged, which S3 needs: it signs Host into every request. Bodies
# stream both ways with no size cap. Buckets are addressed by path only, so a bucket in the
# hostname matches no server here.

# Garage sends no Max-Age, so preflight answers get one; an empty value adds no header.
map $$request_method $$s3_preflight_max_age {
	OPTIONS 3600;
	default "";
}

server {
	listen 80;
	listen [::]:80;
	server_name s3-svc.${WILDCARD_DOMAIN} s3-admin-svc.${WILDCARD_DOMAIN};

	return 301 https://$$host$$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name s3-svc.${WILDCARD_DOMAIN};

	ssl_certificate ${CERTIFICATE};
	ssl_certificate_key ${CERTIFICATE_KEY};

	client_max_body_size 0;
	proxy_request_buffering off;
	proxy_buffering off;
	proxy_read_timeout 1h;
	proxy_send_timeout 1h;

	# CORS is Garage's: each bucket carries its own allowed origins, and Garage answers the
	# browser's unsigned preflight from the bucket named in the path. Garage sends no Vary, so
	# no cache serves one origin's Allow-Origin to another.
	add_header Access-Control-Max-Age $$s3_preflight_max_age always;
	add_header Vary Origin always;

	location / {
		proxy_pass http://${S3_UPSTREAM};
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $$http_host;
		proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $$scheme;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name s3-admin-svc.${WILDCARD_DOMAIN};

	ssl_certificate ${CERTIFICATE};
	ssl_certificate_key ${CERTIFICATE_KEY};

	location / {
		proxy_pass http://${ADMIN_UPSTREAM};
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $$http_host;
		proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
	}
}
