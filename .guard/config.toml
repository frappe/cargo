ignore_patterns = ["tools/fake_atlas/**"]
instructions = """
Cargo is a Frappe app that provisions and configures the machines behind Frappe Cloud's shared services. Resolve framework behaviour against frappe/frappe rather than guessing: whitelisted methods, DocType controllers and hooks, autoname and naming series, get_password and Password-field encryption, frappe.enqueue and background jobs, and validate_auth in frappe/auth.py all have exact semantics there.

Cargo only talks to three first-party systems, all owned by the same team and deployed together: frappe/pilot (provisions the host Cargo itself runs on), frappe/central (the control plane that issues Cargo's tokens and the secrets a deployment runs on) and frappe/atlas (supplies virtual machines). Treat these as trusted infrastructure, not third-party or user-controlled input. Reaching them over HTTPS, installing pilot from its published release, and acting on their responses is the intended design, not a supply-chain weakness -- a compromise of frappe/pilot or frappe/central already owns everything Cargo could protect, so it is outside the threat model of a Cargo change.

The boundaries worth reviewing are the ones Cargo actually defends: the machines it SSHes into and the configuration it renders onto them; the tokens it holds and which upstream each one opens; anything reachable from a whitelisted endpoint; and whether a failed step leaves a deployment or Central in a state a retry cannot repair.
"""

[context]
repos = ["frappe/frappe", "frappe/pilot", "frappe/central", "frappe/atlas"]

[[rules]]
id = "trusted-upstreams"
rule = "frappe/pilot, frappe/central and frappe/atlas are first-party and trusted. Do not raise findings that assume one of them is hostile, that a pinned release tag may be moved by an attacker, or that a first-party installer needs checksum verification before it runs."
severity = "low"

[[rules]]
id = "trusted-callers"
rule = "Every whitelisted endpoint is reachable only by an authenticated first-party caller -- Central, presenting a token Central itself signed and scoped -- and those callers build their arguments in code rather than passing anything a user typed. A value only a trusted caller can send, in a shape only its own bug could produce, is not an attack surface. If a malformed request would raise an unhandled error instead of a clean 4xx, say so once as a robustness nit, not a vulnerability."
severity = "low"

[[rules]]
id = "migration-patches"
rule = "Cargo runs in production, so a change that leaves existing rows wrong needs a patch in cargo/patches listed in cargo/patches.txt. This covers renaming or removing a DocType, field or module, changing a Select's options, moving data into a new field or child table, and a new mandatory field that existing rows lack. A patch must be safe to run again, and it goes under [pre_model_sync] when it reads a column the new schema drops, otherwise under [post_model_sync]. A change that only adds an optional field, or touches no stored data, needs no patch."
severity = "high"

[auto_approve]
enabled = true
risk_ceiling = "low"
