queue_rules:
  - name: backport
    queue_conditions:
      - base=master
      - author=mergify[bot]
    merge_method: merge
    # Queue backports when Mergify opens them, so master takes them in develop order.
    branch_protection_injection_mode: merge

pull_request_rules:
  - name: Close direct pull requests to master
    conditions:
      - base=master
      - author!=mergify[bot]
      - label!=manual-backport-pr
    actions:
      close:
      comment:
        message: |
          @{{author}}, `master` is the stable branch and accepts only backports. Raise this pull request on `develop` and add the `backport master` label.
          For a manual backport, add the `manual-backport-pr` label and reopen this pull request.

  - name: Backport to master
    conditions:
      - base=develop
      - label="backport master"
    actions:
      backport:
        branches:
          - master
        assignees:
          - "{{ author }}"

  - name: Queue backports to master
    conditions:
      - base=master
      - author=mergify[bot]
    actions:
      queue:
        name: backport

  - name: Keep pull requests up to date
    conditions:
      - -draft
      - -conflict
      - "#commits-behind>0"
    actions:
      update:
